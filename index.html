<style>
  :root{
    --orange: #FF5A1F;
    --cream: #FCF2E3;
    --brown: #3B2417;
    --peach-2: #FBE4D0;
    --white: #FFFFFF;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height: 100%; }

  body{
    font-family: 'Inter', sans-serif;
    background: var(--cream);
    color: var(--brown);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
  }

  h1{
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    line-height: 1.2;
    color: var(--brown);
  }

  a{ text-decoration:none; color:inherit; }
  img{ max-width:100%; display:block; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  @keyframes fadeUpIn{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes ctaPulse{
    0%, 100%{ transform: scale(1); box-shadow: 0 10px 28px rgba(255, 90, 31, 0.4); }
    50%{ transform: scale(1.045); box-shadow: 0 14px 36px rgba(255, 90, 31, 0.6); }
  }

  @keyframes dotPulse{
    0%, 80%, 100%{ opacity: 0.3; transform: scale(0.8); }
    40%{ opacity: 1; transform: scale(1); }
  }

  /* ---------- Conteúdo central (cabe na primeira tela) ---------- */
  main{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 22px;
  }

  .card{
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .logo{
    width: 52px;
    height: 52px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 16px;
    opacity: 0;
    animation: fadeUpIn 0.5s ease forwards;
  }
  .logo img{ width: 100%; height: 100%; object-fit: cover; }

  h1{
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: fadeUpIn 0.5s ease forwards;
    animation-delay: 0.12s;
  }

  .loading-dots{
    display: flex;
    justify-content: center;
    gap: 6px;
    margin: 16px 0;
    opacity: 0;
    animation: fadeUpIn 0.5s ease forwards;
    animation-delay: 0.18s;
  }
  .loading-dots span{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--orange);
    animation: dotPulse 1.3s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2){ animation-delay: 0.18s; }
  .loading-dots span:nth-child(3){ animation-delay: 0.36s; }

  .sub{
    font-size: 1rem;
    line-height: 1.45;
    color: rgba(59,36,23,0.75);
    opacity: 0;
    animation: fadeUpIn 0.5s ease forwards;
    animation-delay: 0.24s;
  }

  .cta-block{
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    animation: fadeUpIn 0.5s ease forwards;
    animation-delay: 0.3s;
  }

  .btn-cta{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    background: var(--orange);
    color: var(--white);
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    padding: 19px 24px;
    border-radius: 100px;
    box-shadow: 0 10px 28px rgba(255, 90, 31, 0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: ctaPulse 2.4s ease-in-out infinite;
    animation-delay: 0.9s;
  }
  .btn-cta:hover{ box-shadow: 0 12px 32px rgba(255, 90, 31, 0.5); }
  .btn-cta:active{ transform: scale(0.96); transition: transform 0.12s ease; }

  .microcopy{
    font-size: 0.82rem;
    color: rgba(59,36,23,0.55);
  }

  @media (min-width: 640px){
    h1{ font-size: 1.8rem; }
    .sub{ font-size: 1.08rem; }
    .btn-cta{ width: auto; padding: 19px 44px; }
    .logo{ width: 64px; height: 64px; }
  }
</style>
</head>
